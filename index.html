<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f2e2b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>الحاسبة الاستثمارية الشاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#e8eeeb;--pn:#f7faf8;--ink:#0f2e2b;--mu:#58716d;--ac:#b7791f;--tl:#1f6f6a;--ln:#c9d6d1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 'Noto Naskh Arabic',Tahoma,serif;display:flex;min-height:100vh}
h1,h2,h3,.big{font-family:Amiri,'Noto Naskh Arabic',serif}
nav{width:250px;background:var(--ink);color:#d9e8e4;padding:18px 0;overflow:auto;position:sticky;top:0;height:100vh;flex:none}
nav h1{font-size:22px;margin:0 18px 12px;color:#fff}
nav h3{font-size:14px;margin:14px 18px 2px;color:#e0b469;font-weight:700}
nav button{display:block;width:100%;text-align:right;background:none;border:0;color:inherit;font:inherit;padding:3px 18px 3px 10px;border-right:3px solid transparent;cursor:pointer}
nav button:hover{background:#17433f}
nav button.on{background:#17433f;border-right-color:var(--ac);color:#fff}
main{flex:1;min-width:0;padding:18px 24px}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--ln);background:var(--pn);border-radius:20px;padding:2px 14px;cursor:pointer;font:inherit;color:var(--ink)}
.chip.on{background:var(--tl);color:#fff;border-color:var(--tl)}
.grid{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:18px;align-items:start}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:16px}
label{display:block;font-size:14px;color:var(--mu);margin-top:8px}
input,select,textarea{width:100%;font:inherit;padding:5px 8px;border:1px solid var(--ln);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.lead{font-size:44px;line-height:1.15;color:var(--tl);font-weight:700;margin:2px 0}
.lead small,.k small{display:block;font:13px 'Noto Naskh Arabic',serif;color:var(--mu)}
.ks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:12px}
.k{border-top:2px solid var(--ac);padding-top:4px}.k b{font-size:19px;font-family:Amiri,serif}
.k span{font-size:14px;color:var(--mu)}
.tw{overflow-x:auto;margin-top:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:4px 10px;border-bottom:1px solid var(--ln);text-align:right;white-space:nowrap}
th{background:#dfe9e5}
.bt{background:var(--tl);color:#fff;border:0;border-radius:6px;padding:5px 14px;font:inherit;cursor:pointer;margin:8px 0 0 6px}
.bt.g{background:#fff;color:var(--ink);border:1px solid var(--ln)}
.note{color:var(--mu);font-size:14px;margin-top:10px}
.pr{display:flex;justify-content:space-between;gap:6px;border-bottom:1px solid var(--ln);padding:3px 0}
.mb{display:none}
@media(max-width:820px){body{display:block}nav{position:fixed;top:0;right:0;width:80%;max-width:300px;transform:translateX(100%);transition:transform .2s;z-index:20;box-shadow:-8px 0 24px #0005}nav.open{transform:none}.mb{display:inline-block}.grid{grid-template-columns:1fr}.lead{font-size:34px}main{padding:14px}}
@media(prefers-reduced-motion:reduce){nav{transition:none}}
#rep,.pm{display:none}#rep h2,#rep h3{margin:12px 0 4px}.pm{color:var(--mu);font-size:14px;margin-bottom:8px}
@media print{nav,.top,.bt,.mb{display:none!important}body{display:block;background:#fff}main{padding:0}.grid{display:block}.card{border:0;padding:6px 0;break-inside:avoid}.pm{display:block}.pr-rep .grid,.pr-rep .pm{display:none}.pr-rep #rep{display:block}svg{max-height:70px}}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
<div class="top" id="top"></div>
<div id="view"></div>
</main>
<script>
const F={d:365,w:52,m:12,q:4,y:1},FQ=[['d','يومي'],['w','أسبوعي'],['m','شهري'],['q','ربع سنوي'],['y','سنوي']];
const CN={USD:['دولار أمريكي',1],EUR:['يورو',.92],SAR:['ريال سعودي',3.75],AED:['درهم إماراتي',3.6725],QAR:['ريال قطري',3.64],KWD:['دينار كويتي',.307],BHD:['دينار بحريني',.376],OMR:['ريال عماني',.385],JOD:['دينار أردني',.709],GBP:['جنيه إسترليني',.79],CHF:['فرنك سويسري',.88],CAD:['دولار كندي',1.37],AUD:['دولار أسترالي',1.5],TRY:['ليرة تركية',41],EGP:['جنيه مصري',48],SYP:['ليرة سورية',13000],RON:['ليو روماني',4.6]};
let S={cur:'SAR',main:['USD','SAR','EUR'],rates:{},v:{},pr:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('invcalc4')||'{}'))}catch(e){}
for(const c in CN)if(!S.rates[c])S.rates[c]=CN[c][1];
const save=()=>{try{localStorage.setItem('invcalc4',JSON.stringify(S))}catch(e){}};
const num=x=>isFinite(x)?(+x).toLocaleString('en-US',{maximumFractionDigits:2}):'—';
const conv=(x,a,b)=>x/S.rates[a]*S.rates[b];
const pw=Math.pow;
const pm=(r,n,P)=>r?P*r/(1-pw(1+r,-n)):P/n;
const npv=(cf,r)=>cf.reduce((s,c,t)=>s+c/pw(1+r,t),0);
function irr(cf){let a=-.99,b=10;if(npv(cf,a)*npv(cf,b)>0)return NaN;for(let i=0;i<200;i++){const m=(a+b)/2;npv(cf,a)*npv(cf,m)<=0?b=m:a=m}return(a+b)/2}
function sim(P,d,n,r,fee,y){const i=pw(1+(r-fee)/100,1/n)-1;let b=P,c=P,o=[];for(let t=1;t<=n*y;t++){b=b*(1+i)+d;c+=d;if(t%n==0)o.push([t/n,c,b,b-c])}return o}
const last=a=>a.length?a[a.length-1]:[0,0,0,0];
const MS=[];
const M=(id,g,t,f,fn)=>MS.push({id,g,t,f,fn});
const FR=['f','دورية الدفعات','m','F'];

M('inc','المال الشخصي','الدخل والرواتب',[['a','مبلغ الدخل',8000],['f','دورية الدخل','m','F'],['g','زيادة سنوية %',5],['y','المدة (سنوات)',10],['s','نسبة الادخار %',20]],v=>{
const A=v.a*F[v.f];let o=[],T=0,Sv=0;for(let i=0;i<v.y;i++){const x=A*pw(1+v.g/100,i);T+=x;Sv+=x*v.s/100;o.push([i+1,x,x/12,x*v.s/100])}
return{k:[['الدخل السنوي الحالي',A,'m'],['يوميًا',A/365,'m'],['أسبوعيًا',A/52,'m'],['شهريًا',A/12,'m'],['الدخل السنوي في آخر سنة',last(o)[1],'m'],['إجمالي الدخل',T,'m'],['إجمالي المدّخر',Sv,'m']],h:['السنة','الدخل السنوي','شهريًا','المدّخر'],r:o}});

M('sav','المال الشخصي','الادخار والأهداف',[['G','الهدف المالي',500000],['C','المبلغ الحالي',20000],['r','العائد السنوي %',6],['y','المدة (سنوات)',10],FR],v=>{
const n=F[v.f],i=pw(1+v.r/100,1/n)-1,N=n*v.y,fvC=v.C*pw(1+i,N),g=v.G-fvC;
const need=g<=0?0:i?g*i/(pw(1+i,N)-1):g/N;
return{k:[['الادخار الدوري المطلوب',need,'m'],['إجمالي ما ستدفعه',need*N,'m'],['قيمة المبلغ الحالي مستقبلًا',fvC,'m'],['الفجوة عن الهدف',Math.max(g,0),'m']],h:[],r:[]}});

M('em','المال الشخصي','صندوق الطوارئ',[['e','المصاريف الشهرية',6000],['m','عدد أشهر الأمان',6],['c','المتوفر حاليًا',10000],['s','ادخار شهري',1500]],v=>{
const T=v.e*v.m,g=Math.max(T-v.c,0);return{k:[['المبلغ المستهدف',T,'m'],['المتبقي',g,'m'],['أشهر الوصول',v.s?g/v.s:NaN,'n'],['نسبة الإنجاز %',T?Math.min(v.c/T*100,100):0,'p']],h:[],r:[]}});

M('ret','المال الشخصي','التقاعد ورأس المال المطلوب',[['ca','العمر الحالي',30],['ra','عمر التقاعد',60],['la','العمر المتوقع',85],['s','الإنفاق الشهري بقيمة اليوم',8000],['i','التضخم %',3],['r1','عائد فترة الادخار %',7],['r2','عائد فترة التقاعد %',5],['sv','المدخرات الحالية',100000],['c','الادخار الشهري',2000]],v=>{
const a=v.ra-v.ca,b=v.la-v.ra,sp=v.s*12*pw(1+v.i/100,a),rr=(1+v.r2/100)/(1+v.i/100)-1;
const cap=rr?sp*(1-pw(1+rr,-b))/rr:sp*b,r1=v.r1/100,f=pw(1+r1,a);
const pr=v.sv*f+(r1?v.c*12*(f-1)/r1:v.c*12*a),gap=cap-pr;
return{k:[['رأس المال المطلوب عند التقاعد',cap,'m'],['المتوقع جمعه',pr,'m'],['الفجوة',Math.max(gap,0),'m'],['ادخار شهري إضافي مطلوب',gap>0?(r1?gap*r1/(f-1)/12:gap/a/12):0,'m'],['الإنفاق السنوي عند التقاعد',sp,'m']],h:[],r:[]}});

M('inf','المال الشخصي','التضخم والقوة الشرائية',[['a','المبلغ الحالي',100000],['i','التضخم السنوي %',4],['y','المدة (سنوات)',10],['r','عائد الاستثمار الاسمي %',7]],v=>{
const fc=v.a*pw(1+v.i/100,v.y),rr=((1+v.r/100)/(1+v.i/100)-1)*100;let o=[];
for(let t=1;t<=v.y;t++)o.push([t,v.a*pw(1+v.i/100,t),v.a/pw(1+v.i/100,t),v.a*pw(1+v.r/100,t)/pw(1+v.i/100,t)]);
return{k:[['تكلفة نفس السلعة مستقبلًا',fc,'m'],['القوة الشرائية للمبلغ مستقبلًا',v.a/pw(1+v.i/100,v.y),'m'],['العائد الحقيقي بعد التضخم',rr,'p'],['قيمة الاستثمار الحقيقية',last(o)[3],'m']],h:['السنة','تكلفة السلعة','قوة المبلغ الشرائية','الاستثمار بقيمة اليوم'],r:o}});

M('cmp','الاستثمارات المالية','الاستثمار المركب',[['P','رأس المال الابتدائي',50000],['d','الإيداع الدوري',1000],FR,['r','العائد السنوي %',8],['fee','رسوم سنوية %',0.5],['y','المدة (سنوات)',15],['tx','ضريبة على الربح %',0]],v=>{
const o=sim(v.P,v.d,F[v.f],v.r,v.fee,v.y),l=last(o),pf=l[3]*(1-v.tx/100);
return{k:[['القيمة النهائية بعد الضريبة',l[1]+pf,'m'],['إجمالي المساهمات',l[1],'m'],['صافي الربح',pf,'m'],['العائد على المساهمات',l[1]?pf/l[1]*100:0,'p'],['المضاعف',l[1]?(l[1]+pf)/l[1]:0,'n']],h:['السنة','المساهمات','الرصيد','الربح'],r:o}});

M('scn','الاستثمارات المالية','مقارنة سيناريوهات العائد',[['P','رأس المال الابتدائي',50000],['d','الإيداع الدوري',1000],FR,['y','المدة (سنوات)',15],['fee','رسوم سنوية %',0.5],['a','سيناريو متحفظ %',5],['b','سيناريو أساسي %',8],['c','سيناريو متفائل %',12]],v=>{
const s=[v.a,v.b,v.c].map(r=>sim(v.P,v.d,F[v.f],r,v.fee,v.y));
return{k:[['متحفظ ('+v.a+'%)',last(s[0])[2],'m'],['أساسي ('+v.b+'%)',last(s[1])[2],'m'],['متفائل ('+v.c+'%)',last(s[2])[2],'m'],['الفرق بين المتفائل والمتحفظ',last(s[2])[2]-last(s[0])[2],'m']],h:['السنة','متحفظ','أساسي','متفائل'],r:s[0].map((x,i)=>[x[0],x[2],s[1][i][2],s[2][i][2]])}});

M('stk','الاستثمارات المالية','الأسهم والصناديق والتوزيعات',[['u','عدد الوحدات',500],['bp','سعر الشراء',40],['sp','سعر البيع المتوقع',55],['dy','عائد التوزيعات السنوي %',3],['y','مدة الاحتفاظ (سنوات)',3],['fe','عمولة كل عملية %',0.15]],v=>{
const cost=v.u*v.bp*(1+v.fe/100),pr=v.u*v.sp*(1-v.fe/100),dv=v.u*v.bp*v.dy/100*v.y,pf=pr+dv-cost;
return{k:[['صافي الربح',pf,'m'],['التوزيعات المستلمة',dv,'m'],['التكلفة الكلية',cost,'m'],['العائد الكلي ROI',cost?pf/cost*100:0,'p'],['العائد السنوي المركب',v.y&&cost?(pw((pr+dv)/cost,1/v.y)-1)*100:0,'p']],h:[],r:[]}});

M('cf','الاستثمارات المالية','التدفقات النقدية NPV / IRR / ROI',[['t','التدفقات (سنة 0 ثم ما بعدها)','-10000, 3000, 4000, 5000, 3000','t'],['r','معدل الخصم %',8]],v=>{
const cf=String(v.t).split(/[,،;\s]+/).map(Number).filter(x=>!isNaN(x));let c=0,pb=NaN,o=[];
cf.forEach((x,t)=>{c+=x;o.push([t,x,x/pw(1+v.r/100,t),c]);if(isNaN(pb)&&c>=0&&t>0)pb=t});
const ng=-cf.filter(x=>x<0).reduce((a,b)=>a+b,0),ps=cf.filter(x=>x>0).reduce((a,b)=>a+b,0);
return{k:[['صافي القيمة الحالية NPV',npv(cf,v.r/100),'m'],['معدل العائد الداخلي IRR',irr(cf)*100,'p'],['ROI',ng?(ps-ng)/ng*100:0,'p'],['فترة الاسترداد (سنة)',pb,'n']],h:['السنة','التدفق','المخصوم','التراكمي'],r:o}});

M('gld','الاستثمارات المالية','الذهب',[['w','الوزن (غرام)',100],['bp','سعر الشراء للغرام',300],['sp','سعر البيع المتوقع للغرام',360],['bf','مصنعية/رسوم الشراء %',3],['sf','خصم/رسوم البيع %',1],['y','المدة (سنوات)',3]],v=>{
const cost=v.w*v.bp*(1+v.bf/100),val=v.w*v.sp*(1-v.sf/100),pf=val-cost;
return{k:[['صافي الربح',pf,'m'],['القيمة عند البيع',val,'m'],['التكلفة',cost,'m'],['العائد الكلي',cost?pf/cost*100:0,'p'],['العائد السنوي',v.y&&cost?(pw(val/cost,1/v.y)-1)*100:0,'p'],['سعر التعادل للغرام',v.w?cost/v.w/(1-v.sf/100):0,'m']],h:[],r:[]}});

M('fx','الاستثمارات المالية','العملات',[['a','المبلغ',10000],['fr','من','USD','C'],['to','إلى','SAR','C'],['ch','تغيّر متوقع في سعر الصرف %',5]],v=>{
const x=conv(v.a,v.fr,v.to),y=x*(1+v.ch/100);
return{k:[['المبلغ بعد التحويل ('+v.to+')',x,'n'],['سعر الصرف',conv(1,v.fr,v.to),'n'],['القيمة بعد التغيّر',y,'n'],['الربح/الخسارة من التغيّر',y-x,'n']],h:[],r:[]}});

M('rent','العقار','شراء وتأجير العقار',[['P','سعر العقار',1500000],['dn','الدفعة الأولى %',30],['m','الإيجار الشهري',9000],['oc','نسبة الإشغال %',92],['ex','المصاريف % من الإيجار',15],['rg','نمو الإيجار سنويًا %',3],['ap','ارتفاع قيمة العقار سنويًا %',4],['y','المدة (سنوات)',10],['lr','فائدة التمويل %',6],['ly','مدة التمويل (سنوات)',20]],v=>{
const L=v.P*(1-v.dn/100),r=v.lr/1200,pay=L?pm(r,v.ly*12,L):0,inv=v.P*v.dn/100;let bal=L,cum=0,o=[],c1=0,n1=0;
for(let i=0;i<v.y;i++){const rt=v.m*12*pw(1+v.rg/100,i)*v.oc/100,noi=rt*(1-v.ex/100);let pd=0;
for(let k=0;k<12;k++)if(bal>0){bal=bal*(1+r)-pay;pd+=pay}if(bal<0)bal=0;
const cf=noi-pd;cum+=cf;if(!i){c1=cf;n1=noi}o.push([i+1,rt,noi,cf,v.P*pw(1+v.ap/100,i+1),bal])}
const val=v.P*pw(1+v.ap/100,v.y),pf=cum+val-bal-inv;
return{k:[['إجمالي الربح',pf,'m'],['العائد على رأس المال ROI',inv?pf/inv*100:0,'p'],['العائد الإجمالي',v.P?v.m*12/v.P*100:0,'p'],['العائد الصافي (Cap Rate)',v.P?n1/v.P*100:0,'p'],['القسط الشهري',pay,'m'],['التدفق النقدي للسنة الأولى',c1,'m'],['قيمة العقار في النهاية',val,'m'],['رصيد القرض المتبقي',bal,'m']],h:['السنة','الإيجار الفعلي','صافي التشغيل','التدفق بعد القسط','قيمة العقار','رصيد القرض'],r:o}});

M('val','العقار','تقييم العقار',[['m','الإيجار الشهري',9000],['oc','الإشغال %',92],['ex','المصاريف السنوية',15000],['cap','معدل الرسملة Cap Rate %',6.5],['ar','المساحة (م²)',300],['pp','سعر المتر في السوق',4800]],v=>{
const noi=v.m*12*v.oc/100-v.ex,a=v.cap?noi/(v.cap/100):0,b=v.ar*v.pp;
return{k:[['القيمة المقدّرة (متوسط الطريقتين)',(a+b)/2,'m'],['بالدخل (NOI ÷ Cap)',a,'m'],['بمقارنة السوق',b,'m'],['صافي الدخل التشغيلي NOI',noi,'m'],['سعر المتر حسب الدخل',v.ar?a/v.ar:0,'m']],h:[],r:[]}});

M('dev','العقار','تطوير: أرض ← بناء ← بيع',[['la','مساحة الأرض (م²)',600],['lp','سعر متر الأرض',1500],['ba','مساحة البناء (م²)',900],['bc','تكلفة متر البناء',1800],['ex','إضافات وتشطيبات',100000],['ds','التصميم والإشراف % من البناء',5],['ct','احتياطي طوارئ %',5],['fn','تمويل ورسوم % من الإجمالي',4],['sa','المساحة القابلة للبيع (م²)',800],['sp','سعر بيع المتر',4200],['mo','مدة المشروع (أشهر)',18]],v=>{

if(!isNaN(st))for(let k=0;k<cnt;k++){if(add(st,k)<=now)ps++;else{nx=ymd(add(st,k));break}}
const exp=Math.min(d.tot,ps*d.inst),ar=Math.max(0,exp-paid);tr+=rem;tp+=paid;ta+=ar;
return[d.n,d.o>=0&&f.mem[d.o]?f.mem[d.o].n:'مشترك (العائلة)',d.tot,paid,rem,d.tot?paid/d.tot*100:0,d.inst>0?Math.ceil(rem/d.inst):0,rem>0?nx:'سُدّد',ar,f.mem.filter((m,q)=>dp[i][q]>0).map(m=>m.n+' '+num(dp[i][f.mem.indexOf(m)])).join('، ')||'—']});
const se=[];for(let a=0;a<N;a++)for(let b=a+1;b<N;b++){const n=ow[a][b]-ow[b][a];if(Math.abs(n)>.5)se.push(n>0?[f.mem[a].n,f.mem[b].n,n]:[f.mem[b].n,f.mem[a].n,-n])}
const mel=st=>{const s=new Date(st+'T00:00:00');if(isNaN(s))return 0;let c=0;while(c<600&&add(s,c)<=now)c++;return c};
let SP=0,SA=0;const pa=[];f.pj.forEach((p,j)=>f.mem.forEach((m,i)=>{const pl=(p.ini[i]||0)+(p.al[i]||0)*mel(p.st),ac=ip[j][i];if(pl||ac){SP+=pl;SA+=ac;pa.push([p.n,m.n,pl,ac,ac-pl,pl?ac/pl*100:100])}}));
const mb=d=>{const x=new Date(d+'T00:00:00');return isNaN(x)?0:Math.max(0,(x.getFullYear()-now.getFullYear())*12+x.getMonth()-now.getMonth())};
const TI=f.mem.reduce((a,m)=>a+m.inc,0)||1,gr=[],gm=[];let GT=0;
f.goals.forEach((g,j)=>{const rs=gp[j].reduce((a,b)=>a+b,0),rem=Math.max(g.tgt-rs,0),ml=mb(g.d),req=ml?rem/ml:rem;GT+=rs;

h:['العضو','بدأ بـ','دخل','ادخر','استثمر','سدّد ديونًا','أنفق','ساهم في الأهداف','صافي التحويلات','رصيد الصندوق الآن','صافي ثروته (رصيد + ادخار + استثمار)'],
r:f.mem.map((m,i)=>[m.n,m.open||0,B.inc[i],B.sav[i],B.inv[i],B.debt[i],B.exp[i],B.goal[i],B.tIn[i]-B.tOut[i],cash[i],cash[i]+B.sav[i]+B.inv[i]]),x,

const H=130+L.reduce((a,l)=>a+(l[0]=='h'?44:36),0)+56,c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d');
const A='Amiri,"Noto Naskh Arabic",serif',B='"Noto Naskh Arabic",Tahoma,serif';
g.fillStyle='#f7faf8';g.fillRect(0,0,W,H);g.fillStyle='#0f2e2b';g.fillRect(0,0,W,96);g.direction='rtl';g.textAlign='right';
g.fillStyle='#fff';g.font='700 32px '+A;g.fillText(m.t,W-pd,48);g.fillStyle='#e0b469';g.font='15px '+B;g.fillText(m.d+' — العملة: '+S.cur,W-pd,80);
let y=136;L.forEach(l=>{if(l[0]=='h'){g.fillStyle='#b7791f';g.font='700 21px '+A;g.textAlign='right';g.fillText(l[1],W-pd,y);g.fillRect(pd,y+8,W-2*pd,2);y+=44}
else{g.fillStyle='#58716d';g.font='16px '+B;g.textAlign='right';g.fillText(l[1],W-pd,y);g.fillStyle='#0f2e2b';g.font='700 17px '+B;g.textAlign='left';g.fillText(l[2],pd,y);y+=36}});
g.fillStyle='#58716d';g.font='13px '+B;g.textAlign='center';g.fillText('أرقام تقديرية للتخطيط وليست نصيحة استثمارية',W/2,H-18);
c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=(lastMeta.f||cur)+'.png';a.click()})}
function calc(){const m=MS.find(x=>x.id==cur),v=vals();S.v[cur]=v;save();const o=lastOut=m.fn(v);lastMeta={t:m.t,d:D(),ins:m.f.map(f=>[String(f[1]).split(':')[0],f[3]=='F'?(FQ.find(q=>q[0]==v[f[0]])||[0,''])[1]:f[3]=='C'?v[f[0]]:f[3]=='t'?v[f[0]]:num(v[f[0]])])};
paint(o)}
function paint(o){
const eq=(x,t)=>t=='m'?'<small>≈ '+S.main.filter(c=>c!=S.cur).map(c=>num(conv(x,S.cur,c))+' '+c).join(' · ')+'</small>':'';
const k=o.k,l=k[0];
let h=`<div class="lead">${fmtV(l[1],l[2])}<small>${l[0]}</small>${eq(l[1],l[2])}</div><div class="ks">`+k.slice(1).map(x=>`<div class="k"><span>${x[0]}</span><br><b>${fmtV(x[1],x[2])}</b>${eq(x[1],x[2])}</div>`).join('')+'</div>';
if(!o.ns&&o.r.length>1&&o.r[0].length>2){const ys=o.r.map(r=>+r[r.length-1]||0),mx=Math.max(...ys.map(Math.abs))||1,w=600/(ys.length-1);
h+=`<svg viewBox="0 0 600 70" style="width:100%;margin-top:14px"><polyline fill="none" stroke="#b7791f" stroke-width="2.5" points="${ys.map((y,i)=>(i*w).toFixed(1)+','+(65-Math.max(y,0)/mx*60).toFixed(1)).join(' ')}"/></svg>`}
if(o.r.length)h+=tb(o.h,o.r);(o.x||[]).forEach(z=>h+=tb(z.h,z.r,z.t));if(o.note)h+=`<p class="note">${o.note}</p>`;
h+=`<button class="bt" id="png">حفظ كصورة PNG</button><button class="bt" id="pr1">طباعة التقرير (نتيجة + مدخلات)</button><button class="bt g" id="pr2">طباعة الصفحة كاملة</button><button class="bt g" id="csv">تصدير CSV</button><p class="note">النتائج تقديرية لأغراض التخطيط وليست نصيحة استثمارية.</p>`;
$('#res').innerHTML=h;$('#rep').innerHTML=rep();$('#pm').innerHTML=metaLine()}
function csv(){const o=lastOut,m=lastMeta;let a=[[m.t],[m.d],['العملة',S.cur],[],['المدخلات'],...m.ins.map(x=>[x[0],String(x[1]).split('\n').join(' ؛ ')]),[],['النتائج'],...o.k.map(x=>[x[0],x[1]])];
if(o.r.length)a.push([],o.h,...o.r);(o.x||[]).forEach(z=>a.push([],[z.t||''],z.h,...z.r));
const t='\ufeff'+a.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),b=new Blob([t],{type:'text/csv'}),u=document.createElement('a');u.href=URL.createObjectURL(b);u.download=(lastMeta.f||cur)+'.csv';u.click()}
function curr(){
$('#view').innerHTML=`<h2 style="margin:0 0 10px;font-size:28px">العملات العالمية</h2><div class="grid"><div class="card"><h3 style="margin:0">العملات الثلاث في الواجهة</h3>
${[0,1,2].map(i=>`<label>العملة ${i+1}</label><select data-mc="${i}">${opts('C',S.main[i])}</select>`).join('')}
<p class="note">اختر هنا من القائمة الكاملة؛ تظهر الثلاث فقط في أعلى التطبيق للتبديل السريع. كل الحسابات تُحوَّل داخليًا عبر الدولار.</p>
<button class="bt g" id="rr">إعادة الأسعار الافتراضية</button></div>
<div class="card"><h3 style="margin:0 0 6px">أسعار الصرف (لكل 1 دولار)</h3><p class="note" style="margin:0 0 6px">أسعار تقريبية قابلة للتعديل؛ حدّثها بنفسك.</p><div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 12px">${Object.keys(CN).map(c=>`<div><label>${c} — ${CN[c][0]}</label><input type="number" step="any" data-rt="${c}" value="${S.rates[c]}"></div>`).join('')}</div></div></div>`}
function projects(){const pr=Object.keys(S.pr);
$('#view').innerHTML=`<h2 style="margin:0 0 10px;font-size:28px">المشاريع المحفوظة</h2><div class="card">${pr.length?pr.map(n=>`<div class="pr"><span>${n} <small class="note">(${MS.find(m=>m.id==S.pr[n].m).t})</small></span><span><button class="bt" data-o="${n}">فتح</button><button class="bt g" data-x="${n}">حذف</button></span></div>`).join(''):'<p class="note">لا توجد مشاريع بعد. افتح أي حاسبة واضغط «حفظ كمشروع».</p>'}</div><div class="card" style="margin-top:14px"><h3 style="margin:0">نسخة احتياطية ومشاركة</h3><p class="note">بياناتك محفوظة في هذا المتصفح فقط. صدّر نسخة لتحفظها أو لترسلها لأخيك، واستوردها في متصفح آخر.</p><button class="bt" id="bk">تصدير نسخة احتياطية</button><label class="bt g" style="display:inline-block;cursor:pointer">استيراد نسخة<input type="file" id="bkf" accept=".json" hidden></label></div>`}
document.addEventListener('click',e=>{const t=e.target;
if(t.dataset.m)show(t.dataset.m);
else if(t.id=='adb'){S.fam.debts.push({n:'دين جديد',tot:10000,inst:1000,d:ymd(new Date()),o:-1});led()}
else if(t.dataset.dd!==undefined){const i=+t.dataset.dd;S.fam.debts.splice(i,1);fixRef('d',i);led()}
else if(t.dataset.dt!==undefined){S.fam.tx.splice(+t.dataset.dt,1);led()}
else if(t.id=='adg'){const d=new Date();d.setFullYear(d.getFullYear()+1);S.fam.goals.push({n:'هدف جديد',tgt:100000,d:ymd(d)});led()}
else if(t.dataset.dg!==undefined){const i=+t.dataset.dg;S.fam.goals.splice(i,1);fixRef('g',i);led()}
else if(t.id=='sal'){const f=S.fam;f.mem.forEach((m,i)=>m.inc&&f.tx.push({d:ymd(new Date()),m:i,c:'inc',r:'',a:m.inc,n:'راتب'}));led()}
else if(t.id=='atx'){const f=S.fam,g=i=>$('#'+i).value,c=g('x-c'),r=g('x-r'),a=parseFloat(g('x-a'))||0,m=+g('x-m'),nd={debt:'d',inv:'p',tr:'m',goal:'g'}[c];
if(!a)return alert('أدخل المبلغ');if(nd&&!(r&&r[0]==nd))return alert('اختر الدين أو المشروع أو العضو المناسب في خانة «المرتبط به»');if(c=='tr'&&+r.slice(1)==m)return alert('لا يمكن التحويل لنفس الصندوق');
f.tx.push({d:g('x-d'),m,c,r:nd?r:'',a,n:g('x-n')});save();led()}
else if(t.id=='bk'){const b=new Blob([JSON.stringify(S)],{type:'application/json'}),u=document.createElement('a');u.href=URL.createObjectURL(b);u.download='investment-backup-'+ymd(new Date())+'.json';u.click()}
else if(t.id=='am'){const f=S.fam;f.mem.push({n:'عضو جديد',job:'',age:30,inc:10000,sv:10,g:3,open:0});f.pj.forEach(p=>{p.ini.push(0);p.al.push(0)});fam()}
else if(t.id=='ap'){const f=S.fam;f.pj.push({n:'مشروع جديد',st:ymd(new Date()),r:10,ini:f.mem.map(()=>0),al:f.mem.map(()=>0)});fam()}
else if(t.dataset.dm!==undefined){const f=S.fam,i=+t.dataset.dm;f.mem.splice(i,1);f.pj.forEach(p=>{p.ini.splice(i,1);p.al.splice(i,1)});fixRef('m',i);fam()}
else if(t.dataset.dp!==undefined){S.fam.pj.splice(+t.dataset.dp,1);fixRef('p',+t.dataset.dp);fam()}
else if(t.dataset.c){S.cur=t.dataset.c;save();buildTop();refresh()}
else if(t.id=='sv'){const n=prompt('اسم المشروع:');if(n){S.pr[n]={m:cur,v:S.v[cur]};save()}}
else if(t.id=='csv')csv();else if(t.id=='png')png();else if(t.id=='pr1')prt('pr-rep');else if(t.id=='pr2')prt('');
else if(t.id=='mb')$('#nav').classList.toggle('open');
else if(t.id=='rr'){S.rates={};for(const c in CN)S.rates[c]=CN[c][1];save();curr()}
else if(t.dataset.o){const p=S.pr[t.dataset.o];S.v[p.m]=p.v;show(p.m)}
else if(t.dataset.x){delete S.pr[t.dataset.x];save();projects()}});
document.addEventListener('input',e=>{const t=e.target;
if(t.dataset.p!==undefined){setP(t);cur=='_l'?ledCalc():famCalc()}
else if(t.dataset.k)calc();
else if(t.dataset.rt){S.rates[t.dataset.rt]=parseFloat(t.value)||S.rates[t.dataset.rt];save()}});
document.addEventListener('change',e=>{const t=e.target;
if(t.id=='bkf'){if(!t.files[0])return;if(!confirm('سيستبدل الاستيراد بياناتك الحالية. متابعة؟')){t.value='';return}const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d||!d.rates)throw 0;S=Object.assign(S,d);normFam();save();buildTop();show('_p');alert('تم الاستيراد')}catch(e){alert('الملف غير صالح')}};r.readAsText(t.files[0])}
else if(t.dataset.mc){S.main[+t.dataset.mc]=t.value;if(!S.main.includes(S.cur))S.cur=S.main[0];save();buildTop();refresh()}});
buildTop();show(cur);
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
